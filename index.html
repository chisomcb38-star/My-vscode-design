<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vscode Screen</title>
    <link rel="stylesheet" href="main.css">
</head>

    <header>        
       <div class="menu">
         <span>File</span>
         <span>Selection</span>
         <span>View</span>
         <span>Go</span>
         <span>Run</span>
         <span>...</span>
       </div>
       <div class="search-box">search</div>
    </header>

    <aside>
        <div class="sidebar">
          <img src="icons/akar-icons--file.svg" alt="File icon" width="30">
          <img src="icons/andrsrxn--search.svg" alt="Search icon" width="30">
          <img src="icons/codicon--source-control.svg" alt="Source control icon" width="30">
          <img src="icons/akar-icons--shipping-box-01.svg" alt=" box icon" width="30">
          <img src="icons/emojione--man-in-suit-levitating.svg" alt=" Run and debug icon" width="30">
          <img src="icons/bx--pie-chart-alt.svg" alt="Postman icon" width="30">
          <img src="icons/mdi--lightning-bolt-circle.svg" alt="Thunder client icon" width="30">
          <img src="icons/arcticons--microsoft-edge.svg" alt="Microsoft edge icon" width="30">
          <img src="icons/bytesize--settings.svg" alt="Settings icon" width="30">
        </div>
    </aside>

   <main>
        <div class="logo"> 
          <img src="image/visual-studio.svg" alt="vscode" class="logo-image" width="300">  
        </div>
        
        <div class="shortcut-list">
          <div class="shortcut">
             <span>Open Chat</span>
             <div class="buttons">
                 <button>Ctrl</button> + <button>Alt</button> + <button>I</button>
             </div>
            </div>

          <div class="shortcut">
             <span>Show All Commands</span>
             <div class="keys">
                 <button>Ctrl</button> + <button>Shift</button> + <button>P</button>
              </div>
          </div>

           <div class="shortcut">
              <span>Open Recent</span>
              <div class="keys">
                 <button>Ctrl</button> + <button>R</button>
              </div>
          </div>

          <div class="shortcut">
             <span>Open File</span>
             <div class="keys">
                 <button>Ctrl</button> + <button>O</button>
             </div>
          </div>

           <div class="shortcut">
             <span>Open Folder</span>
             <div class="keys" div class="buttons">
                 <button>Ctrl</button> + <button>K</button> + <button>O</button>
             </div>
           </div>
       </div>
   </main>
   <footer>
       <div class="footer">
          <img src="icons/pinhead--axial-reflecting-dish-with-monopod-antenna-and-beams.svg" alt="open a remote window icon" width="20">
          <img src="icons/emojione--rocket.svg" alt="launchpad icon" width="20">
          <img src="icons/fluent-mdl2--plug-disconnected.svg" alt="launchpad icon" width="20">
          <li>Launchpad</li>
          <img src="icons/ant-design--alert-filled.svg" alt="No problem icon" width="20">
          <img src="icons/akar-icons--triangle-alert-fill(1).svg" alt="launchpad icon" width="20">
          <img src="icons/icon-park-outline--robot-one.svg" alt="copilot icon" width="20">
          <img src="icons/glyphs-poly--signal.svg" alt="go-live icon" width="20">
          <li>Go live</li>
          <img src="icons/arcticons--emoji-bell.svg" alt="notification icon" width="20">
       </div>
    </footer>
    
</body>
</html>
